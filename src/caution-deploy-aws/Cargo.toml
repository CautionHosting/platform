[package]
name = "caution-deploy-aws"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling
thiserror = { workspace = true }
dterror = { workspace = true }

# Deploy interface
caution-deploy = { version = "0.1.0", path = "../caution-deploy" }
# Configuration input
caution-config = { version = "0.1.0", path = "../caution-config" }
# Shared component digest validation
enclave-build = { path = "../enclave-build" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HCL generation for OpenTofu configs
hcl-rs = { version = "0.19", features = ["perf"] }
indexmap = { version = "2", features = ["serde"] }

# Temp files
tempfile = { workspace = true }

# Identity
uuid = { workspace = true }
chrono = { workspace = true }

# HTTP client (EC2/AWS JSON APIs)
reqwest = { version = "0.12", features = ["json"] }

# AWS SDK for S3 uploads
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }

# Signing and encoding
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
