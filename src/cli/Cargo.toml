[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "caution"
path = "src/bin/caution.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }

# Internal dependencies
enclave-builder = { path = "../enclave-builder" }

# CLI-specific dependencies
clap = { version = "4.5", features = ["derive", "env"] }
serde_cbor = "0.11"
authenticator = { version = "0.4", features = ["crypto_openssl"], default-features = false }
qrcode = "0.14"
rpassword = "7.3"
shlex = "1.3"
zeroize = "1"
indicatif = "0.17"

# Attestation verification
bootproof-sdk = { git = "https://codeberg.org/caution/bootproof.git", rev = "b03721957e3850931f5b53627e7c3d1c302a06fe" }
coset = "0.3"

# Locksmith (shard sending)
locksmith = { git = "https://codeberg.org/caution/locksmith.git", rev = "e6e7dd5e5bd6e0bd9ba0a6040499a60e0cc01468" }
keymaker-models = { git = "https://codeberg.org/caution/locksmith.git", rev = "e6e7dd5e5bd6e0bd9ba0a6040499a60e0cc01468" }
sequoia-openpgp = { workspace = true }

# Archive handling
flate2 = "1.0"
tar = "0.4"
caution-environment-heuristics = { version = "0.1.0", path = "../environment-heuristics" }
caution-config = { version = "0.1.0", path = "../caution-config" }
hcl-rs = { version = "0.19.7", features = ["perf"] }

[build-dependencies]
caution-environment-heuristics = { version = "0.1.0", path = "../environment-heuristics" }
serde_json.workspace = true
