[package]
name = "caution-admin"
version = "0.1.0"
edition = "2024"
description = "Read-only server-side administration explorer for Caution"
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[[bin]]
name = "caution-admin"
path = "src/main.rs"

[dependencies]
aws-config = "1.5"
aws-sdk-costexplorer = { version = "1.15", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.82", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dterror = { workspace = true }
drift-detector = { path = "../drift-detector" }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
