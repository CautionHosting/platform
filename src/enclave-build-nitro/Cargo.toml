[package]
name = "enclave-build-nitro"
version = "0.1.0"
edition = "2021"

[features]
default = []
s3-components = ["dep:aws-config", "dep:aws-sdk-s3", "dep:clap", "enclave-build/s3-components"]

[[bin]]
name = "prepare-components"
path = "src/bin/prepare-components.rs"
required-features = ["s3-components"]

[dependencies]
enclave-build = { path = "../enclave-build" }
caution-config = { version = "0.1.0", path = "../caution-config" }
aws-config = { version = "1.1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# Error handling
thiserror = { workspace = true }
dterror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
futures-util = "0.3"
async-trait = { workspace = true }

# Docker interaction
bollard = "0.17"

# Filesystem operations
tempfile = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Logging
tracing = { workspace = true }

# Path handling
walkdir = "2"

# UUID generation
uuid = { workspace = true }

# Tar archive handling
tar = "0.4"
flate2 = "1.0"

# HTTP client for downloading archives
reqwest = { workspace = true }

# CBOR for attestation parsing
serde_cbor = "0.11"
base64 = { workspace = true }

[dev-dependencies]
bootproof-sdk = { git = "https://git.caution.co/public/bootproof.git", rev = "2590edb0f23cae6589bc73cc8324673023ac1deb" }
coset = "0.3"
rand = { workspace = true }
