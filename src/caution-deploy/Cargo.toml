[package]
name = "caution-deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling
thiserror = { workspace = true }
dterror = { workspace = true }

# Configuration input for deploy platforms
caution-config = { version = "0.1.0", path = "../caution-config" }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Async
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
