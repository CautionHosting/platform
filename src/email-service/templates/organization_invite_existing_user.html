<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Organization invite</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 10px;">
        <p>{inviter} invited you to join <strong>{org_name}</strong>.</p>

        <p>This address already has a Caution account, so this invitation link cannot add it.</p>

        <p style="color: #7f8c8d; font-size: 14px;">
            Ask {inviter} to add you to {org_name} from the organization's member settings.
        </p>
    </div>

{footer}
</body>
</html>
