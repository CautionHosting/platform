<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account • Caution</title>
    <meta name="description" content="Create a Caution account with an access code and passkey.">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/caution-icon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-caution-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-caution-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-caution-16x16.png">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.paddle.com https://*.paddle.com https://public.profitwell.com https://*.profitwell.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com; frame-src 'self' https://*.paddle.com https://sandbox-checkout.paddle.com https://checkout.paddle.com; connect-src 'self' https:; img-src 'self' data: https://*.paddle.com https://public.profitwell.com https://*.profitwell.com;">

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#e8f4fc">
    <meta name="msapplication-TileColor" content="#e8f4fc">

    <!-- Search engine directives -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://dashboard.caution.co/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dashboard.caution.co/">
    <meta property="og:title" content="Create an account • Caution">
    <meta property="og:description" content="Create a Caution account with an access code and passkey.">
    <meta property="og:image" content="https://dashboard.caution.co/thumbnail.png">
    <meta property="og:image:alt" content="Caution dashboard preview">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dashboard.caution.co/">
    <meta name="twitter:title" content="Create an account • Caution">
    <meta name="twitter:description" content="Create a Caution account with an access code and passkey.">
    <meta name="twitter:image" content="https://dashboard.caution.co/thumbnail.png">
    <meta name="twitter:image:alt" content="Caution dashboard preview">

    <script>
      (() => {
        const key = 'caution-theme'
        const storedTheme = (() => {
          try {
            return window.localStorage.getItem(key)
          } catch {
            return null
          }
        })()
        const theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light'
        const color = theme === 'dark' ? '#090d12' : '#e8f4fc'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        for (const selector of ['meta[name="theme-color"]', 'meta[name="msapplication-TileColor"]']) {
          const element = document.querySelector(selector)
          if (element) {
            element.setAttribute('content', color)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
